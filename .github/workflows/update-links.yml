name: Update links.json

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract data
        id: extract
        run: |
          BODY="${{ github.event.issue.body }}"

          echo "---- BODY ----"
          echo "$BODY"
          echo "--------------"

          SLUG=$(echo "$BODY" | grep '^slug:' | head -n1 | cut -d ':' -f2- | xargs)
          URL=$(echo "$BODY" | grep '^url:' | head -n1 | cut -d ':' -f2- | xargs)

          echo "Slug: $SLUG"
          echo "URL: $URL"

          if [ -z "$SLUG" ]; then
            echo "❌ Error: slug es obligatorio"
            exit 1
          fi

          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Update links.json
        run: |
          SLUG="${{ steps.extract.outputs.slug }}"
          URL="${{ steps.extract.outputs.url }}"

          echo "Processing slug: $SLUG"

          if [ -z "$URL" ]; then
            echo "🗑️ Deleting entry"

            jq --arg slug "$SLUG" 'del(.[$slug])' links.json > tmp.json
          else
            echo "✏️ Creating/updating entry"

            jq --arg slug "$SLUG" --arg url "$URL" '.[$slug]=$url' links.json > tmp.json
          fi

          mv tmp.json links.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add links.json
          git commit -m "Update link ${{ steps.extract.outputs.slug }}" || echo "No changes"
          git push

      - name: Close issue
        uses: peter-evans/close-issue@v3
        with:
          comment: "✅ Cambio aplicado automáticamente"
