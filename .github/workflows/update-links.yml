name: Update links.json

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract slug and url
        id: extract
        run: |
          BODY="${{ github.event.issue.body }}"

          echo "---- BODY ----"
          echo "$BODY"
          echo "--------------"

          # Extrae slug y url ignorando encabezados
          SLUG=$(echo "$BODY" | sed -n '/Slug/{n;p;}' | head -n1 | xargs)
          URL=$(echo "$BODY" | sed -n '/URL/{n;p;}' | head -n1 | xargs)

          echo "Slug: $SLUG"
          echo "URL: $URL"

          if [ -z "$SLUG" ] || [ -z "$URL" ]; then
            echo "❌ Error: slug o url vacíos"
            exit 1
          fi

          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Update JSON
        run: |
          jq --arg slug "${{ steps.extract.outputs.slug }}" \
             --arg url "${{ steps.extract.outputs.url }}" \
             '.[$slug]=$url' links.json > tmp.json
          mv tmp.json links.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add links.json
          git commit -m "Update link ${{ steps.extract.outputs.slug }}" || echo "No changes"
          git push

      - name: Close issue
        uses: peter-evans/close-issue@v3
        with:
          comment: "✅ Enlace actualizado automáticamente"
