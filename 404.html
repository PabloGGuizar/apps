<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6; /* Fondo gris claro */
      color: #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Pantalla de carga */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spinner {
      border: 4px solid #e5e7eb;
      border-top: 4px solid #3b82f6; /* Color azul */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Contenedor del Error 404 (oculto por defecto) */
    #error-container {
      display: none;
      text-align: center;
      padding: 2.5rem 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
    }

    /* Icono SVG */
    .icon {
      width: 80px;
      height: 80px;
      color: #ef4444; /* Color rojo de error */
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
      color: #111827;
    }

    p {
      margin: 1rem 0 1.5rem 0;
      color: #4b5563;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <!-- Pantalla de carga mientras se lee el JSON -->
  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 1rem; color: #6b7280;">Buscando destino...</p>
  </div>

  <!-- Contenedor 404 que se mostrará si el enlace no existe -->
  <div id="error-container">
    <!-- Icono SVG de enlace roto -->
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
    </svg>
    <h1>404</h1>
    <p>¡Ups! El enlace que buscas no existe, está mal escrito o ha sido eliminado.</p>
    <a href="/apps/" class="btn">Volver al inicio</a>
  </div>

  <script>
    // Limpia la ruta para extraer el slug (por ejemplo: extrae "test2" de "/apps/test2")
    const slug = window.location.pathname.replace("/apps/", "").replace(/\/$/, ""); 
    const loading = document.getElementById('loading');
    const errorContainer = document.getElementById('error-container');

    // Función para mostrar el error visualmente
    function showError() {
      document.title = "404 - Enlace no encontrado";
      loading.style.display = 'none';
      errorContainer.style.display = 'block';
    }

    // Comprobamos si estamos en el entorno de vista previa (Canvas)
    const isPreview = window.location.protocol === 'blob:' || window.location.hostname.includes('usercontent.goog');

    if (isPreview) {
      // En Canvas, los fetch relativos en blobs fallan, así que simulamos el comportamiento
      // para que puedas ver la pantalla de carga y luego el diseño del 404.
      setTimeout(() => {
        showError();
      }, 800);
    } else {
      // Petición real para el entorno de producción en GitHub Pages
      fetch("/apps/links.json")
        .then(res => res.json())
        .then(data => {
          // En la raíz, el slug estará vacío.
          if (slug === "" || slug === "/") {
            showError();
            return;
          }

          if (data[slug]) {
            // Si el link existe, redirigir sin guardar el salto en el historial (replace)
            window.location.replace(data[slug]);
          } else {
            // Si no existe en el JSON, mostrar error
            showError();
          }
        })
        .catch(err => {
          console.error("Error al cargar los enlaces:", err);
          showError();
        });
    }
  </script>
</body>
</html>
